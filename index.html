<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EveryReplay</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:black;
    overflow:hidden;
    color:white;
}

#feed{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
}

.video-card{
    position:relative;
    width:100%;
    height:100vh;
    scroll-snap-align:start;
    background:black;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    position:absolute;
    bottom:80px;
    left:15px;
    z-index:10;
    text-shadow:0 0 5px black;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.logo{
    position:fixed;
    top:10px;
    left:15px;
    z-index:100;
    font-size:28px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="logo">EveryReplay</div>

<div id="feed"></div>

<script>
const feed = document.getElementById("feed");

// lista automaticamente TODOS os vídeos da pasta
async function carregarVideos(){

    // lista dos arquivos da pasta
    const response = await fetch("videos/");
    const text = await response.text();

    // pega arquivos mp4/webm/ogg
    const parser = new DOMParser();
    const html = parser.parseFromString(text, "text/html");

    const links = [...html.querySelectorAll("a")];

    const videos = links
        .map(link => link.getAttribute("href"))
        .filter(file =>
            file.endsWith(".mp4") ||
            file.endsWith(".webm") ||
            file.endsWith(".ogg")
        );

    videos.forEach(videoFile => criarVideo(videoFile));
}

function criarVideo(videoFile){

    const titulo = videoFile
        .split("/")
        .pop()
        .split(".")[0];

    const card = document.createElement("div");
    card.className = "video-card";

    const video = document.createElement("video");
    video.src = "videos/" + videoFile;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("div");
    title.className = "title";
    title.innerText = titulo;

    info.appendChild(title);

    card.appendChild(video);
    card.appendChild(info);

    feed.appendChild(card);

    const observer = new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
            if(entry.isIntersecting){
                video.play();
            }else{
                video.pause();
            }
        });
    },{threshold:0.7});

    observer.observe(video);
}

carregarVideos();
</script>

</body>
</html>
